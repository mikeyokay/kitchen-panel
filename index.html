<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Kitchen Panel</title>

<style>
/* Standalone kitchen panel, built for older Safari (iPadOS 15). Left: clock and weather. Right: three very large shortcut buttons. */
:root{
  --bg:#0F1419; --panel:#171E26; --panel-2:#1D2630; --line:#2A3542;
  --text:#EEF2F6; --muted:#9AA8B8; --dim:#6F7F91;
  --amber:#F2B354; --sky:#7CC4F2; --cool:#9EB6FF; --green:#5FD3A0;
  --sent:#24303C;
  --display:"Sora","Manrope",-apple-system,system-ui,sans-serif;
  --body:"Manrope",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-skin="ember"]{--bg:#17110D;--panel:#221913;--panel-2:#2B2018;--line:#3D2E22;--text:#F7EEE6;--muted:#C4AF9C;--dim:#927C68;--amber:#FF9F43;--sky:#F4C77B;--cool:#E8A6A0;--green:#B8D27A;--sent:#3A2A1E}
:root[data-skin="forest"]{--bg:#0E1512;--panel:#15201B;--panel-2:#1B2922;--line:#28392F;--text:#E9F2EC;--muted:#A0B8AA;--dim:#728A7C;--amber:#E8C468;--sky:#7FD1B9;--cool:#A7C4F2;--green:#8BD17C;--sent:#22352B}
:root[data-skin="black"]{--bg:#000000;--panel:#0E0E10;--panel-2:#17171A;--line:#26262B;--text:#F2F2F2;--muted:#A0A0A8;--dim:#6E6E76;--amber:#F2B354;--sky:#7CC4F2;--cool:#9EB6FF;--green:#5FD3A0;--sent:#1C1C20}
:root[data-skin="navy"]{--bg:#0B1430;--panel:#121D40;--panel-2:#18254D;--line:#25335F;--text:#EEF2FA;--muted:#A3B0CF;--dim:#7180A3;--amber:#F5C060;--sky:#7FB2F5;--cool:#B6C2FF;--green:#6FD6A8;--sent:#1E2B58}
:root[data-skin="daylight"]{color-scheme:light;--bg:#EEF1EC;--panel:#FFFFFF;--panel-2:#EEF2EC;--line:#D3DBD0;--text:#1C2420;--muted:#55625B;--dim:#76827B;--amber:#B86E00;--sky:#1F78AE;--cool:#4A58BF;--green:#1E8352;--sent:#E4EBE2}
:root[data-skin="holiday"]{--bg:#0D1712;--panel:#14221A;--panel-2:#1A2B21;--line:#2A3E31;--text:#F4F1E8;--muted:#B5BFA8;--dim:#7E8B75;--amber:#F2C14E;--sky:#F06A6E;--cool:#F2C14E;--green:#6CCB8A;--sent:#24372B}
:root{--art:none}

:root[data-skin="thanksgiving"]{--bg:#1C130D;--panel:#271B13;--panel-2:#31231A;--line:#4A3424;--text:#F8EFE3;--muted:#D2B99C;--dim:#9E856A;--amber:#E9A23B;--sky:#E07B4A;--cool:#E9C27A;--green:#B3BE5E;--sent:#3E2C1E;--art:radial-gradient(ellipse at 0% 0%,rgba(233,162,59,.15),rgba(233,162,59,0) 55%),url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22%3E%3Cpath fill=%22%23E07B2E%22 fill-opacity=%220.18%22 transform=%22translate%2852 56%29 rotate%28-18%29 scale%281.5%29%22 d=%22M0 -14L3 -6L9 -9L7 -2L13 0L6 3L8 8L1 5L1 12L-1 12L-1 5L-8 8L-6 3L-13 0L-7 -2L-9 -9L-3 -6Z%22/%3E%3Cpath fill=%22%23E9B44C%22 fill-opacity=%220.16%22 transform=%22translate%28176 118%29 rotate%2824%29 scale%281.1%29%22 d=%22M0 -14L3 -6L9 -9L7 -2L13 0L6 3L8 8L1 5L1 12L-1 12L-1 5L-8 8L-6 3L-13 0L-7 -2L-9 -9L-3 -6Z%22/%3E%3Cpath fill=%22%23B5482E%22 fill-opacity=%220.18%22 transform=%22translate%2896 192%29 rotate%28-40%29 scale%28.9%29%22 d=%22M0 -14L3 -6L9 -9L7 -2L13 0L6 3L8 8L1 5L1 12L-1 12L-1 5L-8 8L-6 3L-13 0L-7 -2L-9 -9L-3 -6Z%22/%3E%3C/svg%3E")}
:root[data-skin="christmas"]{--bg:#2A0E12;--panel:#38151A;--panel-2:#451B21;--line:#5E262D;--text:#FFF7EE;--muted:#E5C3BC;--dim:#B38D87;--amber:#F4C95D;--sky:#A8DCC6;--cool:#F4C95D;--green:#7FD49A;--sent:#5A2027;--art:radial-gradient(ellipse at 0% 0%,rgba(244,201,93,.14),rgba(244,201,93,0) 55%),url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22%3E%3Cg opacity=%220.16%22%3E%3Cg transform=%22translate%2848 50%29 scale%281.3%29%22%3E%3Cg fill=%22none%22 stroke=%22%23FFFFFF%22 stroke-width=%221.4%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M0 -12V12M-10.4 -6L10.4 6M-10.4 6L10.4 -6%22/%3E%3Cpath d=%22M-3 -9L0 -6L3 -9M-3 9L0 6L3 9M-9.4 -1.3L-5.2 -3L-6.4 -7.5M9.4 1.3L5.2 3L6.4 7.5M-6.4 7.5L-5.2 3L-9.4 1.3M6.4 -7.5L5.2 -3L9.4 -1.3%22/%3E%3C/g%3E%3C/g%3E%3Cg transform=%22translate%28182 120%29 scale%28.9%29%22%3E%3Cg fill=%22none%22 stroke=%22%23FFFFFF%22 stroke-width=%221.4%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M0 -12V12M-10.4 -6L10.4 6M-10.4 6L10.4 -6%22/%3E%3Cpath d=%22M-3 -9L0 -6L3 -9M-3 9L0 6L3 9M-9.4 -1.3L-5.2 -3L-6.4 -7.5M9.4 1.3L5.2 3L6.4 7.5M-6.4 7.5L-5.2 3L-9.4 1.3M6.4 -7.5L5.2 -3L9.4 -1.3%22/%3E%3C/g%3E%3C/g%3E%3Cg transform=%22translate%2892 196%29 scale%28.7%29%22%3E%3Cg fill=%22none%22 stroke=%22%23FFFFFF%22 stroke-width=%221.4%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M0 -12V12M-10.4 -6L10.4 6M-10.4 6L10.4 -6%22/%3E%3Cpath d=%22M-3 -9L0 -6L3 -9M-3 9L0 6L3 9M-9.4 -1.3L-5.2 -3L-6.4 -7.5M9.4 1.3L5.2 3L6.4 7.5M-6.4 7.5L-5.2 3L-9.4 1.3M6.4 -7.5L5.2 -3L9.4 -1.3%22/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3Cg fill=%22%23FFFFFF%22 fill-opacity=%220.12%22%3E%3Ccircle cx=%22150%22 cy=%2236%22 r=%221.6%22/%3E%3Ccircle cx=%22214%22 cy=%22206%22 r=%221.5%22/%3E%3Ccircle cx=%2220%22 cy=%22132%22 r=%221.4%22/%3E%3Ccircle cx=%22128%22 cy=%22118%22 r=%221.2%22/%3E%3C/g%3E%3C/svg%3E")}
:root[data-skin="maroon"]{--bg:#4A1420;--panel:#5A1A28;--panel-2:#6A2131;--line:#7D2C3D;--text:#FFF5F2;--muted:#EBC7CC;--dim:#C9A2A9;--amber:#F5C86A;--sky:#A9D4F2;--cool:#F5C86A;--green:#9FE0B5;--sent:#7A2638}
.lights{display:none;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:58px;pointer-events:none;z-index:5}
.lights svg{display:block}
:root[data-skin="christmas"] .lights{display:block}
:root[data-skin="christmas"] body{padding-top:calc(62px + env(safe-area-inset-top,0px))}
.lights .b{-webkit-animation:tw 2.8s ease-in-out infinite;animation:tw 2.8s ease-in-out infinite}
@-webkit-keyframes tw{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.lights .b{-webkit-animation:none;animation:none}}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:var(--art);background-repeat:no-repeat,repeat;background-attachment:fixed;color:var(--text);font-family:var(--body);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));box-sizing:border-box}
*{box-sizing:border-box}
button,input,select{font:inherit}

.app{display:flex;flex-direction:column;gap:16px;min-height:100%}
.left{display:flex;flex-direction:column;gap:16px}
.clock{font-family:var(--display);font-weight:300;font-size:128px;line-height:.92;letter-spacing:-3px}
.clock small{font-size:38px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:8px}
.date{font-size:22px;color:var(--muted);font-weight:600;margin-top:6px}

.wx{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;flex:1}
.now{display:flex;align-items:center;gap:16px}
.now svg{width:68px;height:68px;color:var(--amber);flex-shrink:0}
.temp{font-family:var(--display);font-size:76px;font-weight:300;line-height:1}
.temp sup{font-size:30px;color:var(--muted);vertical-align:top}
.cond{font-size:22px;font-weight:700}
.hl{font-size:18px;color:var(--muted);margin-top:2px}
.days{display:flex;gap:8px}
.day{flex:1;background:var(--panel-2);border-radius:14px;padding:10px 4px;text-align:center}
.day .d{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.day .hi{font-size:22px;font-weight:700;margin-top:4px}
.day .lo{font-size:15px;color:var(--dim)}
.day .r{font-size:13px;color:var(--sky);min-height:17px}
.wk{display:flex;flex-direction:column}
.wk-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:17px}
.wk-row:last-child{border-bottom:0}
.wk-row .d{width:58px;font-weight:700;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.6px}
.wk-row .ic{width:26px;height:26px;color:var(--sky)} .wk-row .ic svg{width:26px;height:26px}
.wk-row .r{width:40px;text-align:right;font-size:13px;color:var(--sky)}
.wk-row .lo{width:36px;text-align:right;color:var(--dim)}
.wk-row .bar{flex:1;height:8px;border-radius:8px;background:var(--panel-2);position:relative}
.wk-row .bar span{position:absolute;top:0;bottom:0;border-radius:8px;background:var(--amber)}
.wk-row .hi{width:36px;font-weight:700}
.hours{display:flex;gap:6px}
.hr{flex:1;background:var(--panel-2);border-radius:14px;padding:10px 2px;text-align:center}
.hr .t{font-size:13px;font-weight:700;color:var(--muted)}
.hr .ic{display:flex;justify-content:center;margin:6px 0 2px} .hr .ic svg{width:26px;height:26px}
.hr .v{font-size:21px;font-weight:700}
.hr .r{font-size:12px;color:var(--sky);min-height:15px}
.today-text{font-size:20px;line-height:1.45;color:var(--text)}
.today-night{font-size:17px;line-height:1.45;color:var(--muted);margin-top:10px}
.foot{font-size:13px;color:var(--dim);display:flex;justify-content:space-between;margin-top:auto}
.foot.stale{color:var(--amber)}

.right{display:flex;flex-direction:column;gap:14px;flex:1}
.tiles{display:flex;flex-direction:column;gap:14px;flex:1}
.tile{flex:1;min-height:150px;display:flex;align-items:center;gap:20px;padding:20px 22px;border-radius:26px;background:var(--panel);border:2px solid var(--line);color:var(--text);text-decoration:none;-webkit-tap-highlight-color:transparent;-webkit-transition:-webkit-transform .12s,background .2s;transition:transform .12s,background .2s}
.tile .ic{width:88px;height:88px;border-radius:24px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile .ic svg{width:48px;height:48px}
.tile .name{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.tile .label{flex:1;min-width:0;display:flex;align-items:center;gap:22px}
.tile .acts{display:flex;gap:12px;flex-shrink:0}
.act{width:120px;height:96px;border-radius:20px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);font-family:var(--display);font-size:26px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.act:active{-webkit-transform:scale(.96);transform:scale(.96)}
.act.on.b-amber{border-color:var(--amber)} .act.on.b-sky{border-color:var(--sky)} .act.on.b-cool{border-color:var(--cool)} .act.on.b-green{border-color:var(--green)}
.act.sent{background:var(--sent)}
.c-amber{color:var(--amber)} .c-sky{color:var(--sky)} .c-cool{color:var(--cool)} .c-green{color:var(--green)}

.gear{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center}
.gear svg{width:24px;height:24px}

.sheet{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:900px;max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:0 0 14px;color:var(--muted);font-size:15px}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.f label{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.f input,.f select{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:17px}
.skins{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.skins button{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-weight:700}
.skins button.on{border-color:var(--amber)}
.bar{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.bar .msg{margin-right:auto;color:var(--amber);font-size:15px}
.btn{min-height:48px;padding:0 22px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:700}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1206}

.greet{display:none;align-items:center;gap:10px;margin-top:10px;font-family:var(--display);font-size:24px;font-weight:600;color:var(--amber)}
.greet svg{width:30px;height:30px}
.greet svg.turkey{width:64px;height:64px;margin:-4px 0 -10px -4px}
:root[data-skin="halloween"] .greet,:root[data-skin="thanksgiving"] .greet,:root[data-skin="christmas"] .greet{display:flex}
:root[data-skin="halloween"] .wx,:root[data-skin="halloween"] .tile{background:rgba(29,21,36,.80)}
:root[data-skin="thanksgiving"] .wx,:root[data-skin="thanksgiving"] .tile{background:rgba(39,27,19,.80)}
:root[data-skin="christmas"] .wx,:root[data-skin="christmas"] .tile{background:rgba(56,21,26,.80)}
.tile{gap:16px;padding:20px 18px}
.tile .label{gap:16px}
.tile .ic{width:80px;height:80px}
.tile .ic svg{width:44px;height:44px}
.tile .name{font-size:28px;overflow-wrap:break-word;word-wrap:break-word}
.act{width:110px}
@media (min-width:900px){
  .app{flex-direction:row;height:100%}
  .left{width:42%}
  .right{width:58%}
}
</style>
</head>
<body>
<div class="lights" id="lights" aria-hidden="true"></div>
<div class="app">
  <div class="left">
    <div>
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
      <div class="greet" id="greet"></div>
    </div>
    <section class="wx" aria-label="Weather">
      <div class="now">
        <span id="wxicon"></span>
        <div class="temp" id="temp">--<sup>&deg;</sup></div>
        <div>
          <div class="cond" id="cond">Loading weather</div>
          <div class="hl" id="hl"></div>
        </div>
      </div>
      <div id="wxbody"></div>
      <div class="foot" id="foot"><span>Westminster, MD</span><span id="upd"></span></div>
    </section>
  </div>
  <div class="right">
    <div class="tiles" id="tiles"></div>
  </div>
</div>

<button class="gear" id="gear" type="button" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
</button>

<div class="sheet" id="sheet" hidden>
  <form class="card" id="form">
    <h2>Settings</h2>
    <p>Weather view</p>
    <div class="skins" id="wxmodes"></div>
    <p>Colors</p>
    <div class="skins" id="skins"></div>
    <p>Each On and Off button runs the Apple Shortcut with this exact name, spelled the same as in the Shortcuts app.</p>
    <div id="rows"></div>
    <div class="bar">
      <span class="msg" id="msg"></span>
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function svg(p, w){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + "</svg>"; }
  function load(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var ICONS = {
    bulb:{n:"Light", c:"amber", p:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/>'},
    tree:{n:"Holiday tree", c:"green", p:'<path d="M12 2l3 4h-1.5l3 4H15l3.5 5h-13L9 10H7.5l3-4H9Z"/><path d="M12 15v5"/><path d="M9 20h6"/>'},
    star:{n:"Decorations", c:"amber", p:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7Z"/>'},
    moon:{n:"Night", c:"cool", p:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>'},
    power:{n:"All off", c:"sky", p:'<path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/>'},
    home:{n:"Home", c:"green", p:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'}
  };
  var SKINS = [["auto","Auto (by season)"],["halloween","Halloween"],["thanksgiving","Thanksgiving"],["christmas","Christmas"],["daylight","Daylight"],["maroon","Maroon"],["midnight","Midnight"],["ember","Ember"],["forest","Forest"],["holiday","Holiday"],["navy","Navy"],["black","Black"]];
  var DEFAULT_TILES = [
    {label:"Family Room Lights", on:"Family Room Lights On", off:"Family Room Lights Off", icon:"bulb"},
    {label:"Holiday Inside Lights", on:"Holiday Inside Lights On", off:"Holiday Inside Lights Off", icon:"tree"},
    {label:"Outside Decorations", on:"Outside Decorations On", off:"Outside Decorations Off", icon:"star"}
  ];
  var tiles = load("kp.tiles2", DEFAULT_TILES);
  var skin = load("kp.skin", "daylight");
  var wxMode = load("kp.wxmode", "days");
  var WXMODES = [["days","5 days"],["week","Full week"],["today","Today"],["hourly","Hourly"]];
  var WX = null;

  /* Auto: Halloween through Oct 31, Thanksgiving Nov 1 to the day after Thanksgiving, Christmas until Jan 1, Maroon the rest of the year */
  function seasonSkin(){
    var d = new Date(), m = d.getMonth(), day = d.getDate();
    if (m === 9) return "halloween";
    if (m === 10){
      var first = new Date(d.getFullYear(), 10, 1).getDay();
      var thanks = 1 + ((4 - first + 7) % 7) + 21;
      return day <= thanks + 1 ? "thanksgiving" : "christmas";
    }
    if (m === 11) return "christmas";
    return "maroon";
  }
  function applySkin(){
    var s = skin === "auto" ? seasonSkin() : skin;
    if (s && s !== "midnight") document.documentElement.setAttribute("data-skin", s);
    else document.documentElement.removeAttribute("data-skin");
    var G = {
      halloween:["Happy Halloween", '<path d="M12 7c-1-2-.5-3.5 1-4.5"/><path d="M12 7c-3.5 0-8 1.5-8 6.5S8 21 12 21s8-2.5 8-7.5S15.5 7 12 7Z"/><path d="M12 7c-2 1.5-2.5 4-2.5 7s.5 5.5 2.5 7c2-1.5 2.5-4 2.5-7S14 8.5 12 7Z"/>'],
      thanksgiving:["Happy Thanksgiving", '<path d="M12 3l1.6 4.2 4.1-1.8-1.3 4.4 4.1 1.2-3.6 2.6 1.6 3.8-4-.9-.9 4.3L12 17.6l-1.6 3.2-.9-4.3-4 .9 1.6-3.8L3.5 11l4.1-1.2-1.3-4.4 4.1 1.8Z"/><path d="M12 14v8"/>'],
      christmas:["Merry Christmas", '<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 5.5l2.5-2M9.5 20.5L12 18.5l2.5 2M3.6 10.4l3-.8-.6-3.1M20.4 13.6l-3 .8.6 3.1M6 17.5l.6-3.1-3-.8M18 6.5l-.6 3.1 3 .8"/>']
    }[s];
    $("greet").innerHTML = G ? (s === "thanksgiving" ? TURKEY : svg(G[1], 1.8)) + "<span>" + G[0] + "</span>" : "";
    drawLights(s === "christmas");
  }

  var TURKEY = '<svg class="turkey" viewBox="0 0 64 64" aria-hidden="true"><ellipse transform="rotate(-72 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#B5482E"/><ellipse transform="rotate(-48 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#E07B2E"/><ellipse transform="rotate(-24 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#E9B44C"/><ellipse transform="rotate(0 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#C2622D"/><ellipse transform="rotate(24 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#E9B44C"/><ellipse transform="rotate(48 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#E07B2E"/><ellipse transform="rotate(72 32 38)" cx="32" cy="17" rx="6.5" ry="16" fill="#B5482E"/><ellipse cx="32" cy="41" rx="13" ry="14" fill="#7A4A26"/><ellipse cx="32" cy="45" rx="8" ry="8" fill="#9A6234"/><circle cx="32" cy="27" r="7.5" fill="#A0693A"/><circle cx="29.3" cy="25.6" r="1.6" fill="#FFF"/><circle cx="34.7" cy="25.6" r="1.6" fill="#FFF"/><circle cx="29.5" cy="25.8" r=".8" fill="#2A1A10"/><circle cx="34.5" cy="25.8" r=".8" fill="#2A1A10"/><path d="M30.2 28.4H33.8L32 31.6Z" fill="#F2B23A"/><path d="M33.2 29.6c2.2 1.8 1.6 4.4.4 5.6-1.6-1.4-1.8-3.6-.4-5.6Z" fill="#D9363E"/><path d="M28 54.5v4.5M36 54.5v4.5M25.5 59h5M33.5 59h5" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
  /* Christmas light string across the top of the screen */
  function drawLights(show){
    var box = $("lights");
    if (!show){ box.innerHTML = ""; return; }
    var W = window.innerWidth || 1024, SP = 120, n = Math.ceil(W / SP) + 1;
    var COLORS = ["#FF4D4D", "#3DDC84", "#FFC83D", "#4DA3FF", "#FF7AD9"];
    var wire = "", bulbs = "", k = 0;
    for (var i = 0; i < n; i++){
      var x0 = i * SP, cx = x0 + SP / 2, x1 = x0 + SP;
      wire += (i === 0 ? "M" + x0 + " 6" : "") + "Q" + cx + " 34 " + x1 + " 6";
      [0.3, 0.7].forEach(function(t){
        var x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
        var y = (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * 34 + t * t * 6;
        var c = COLORS[k % COLORS.length], d = ((k * 0.61) % 2.8).toFixed(2);
        bulbs += '<g class="b" style="-webkit-animation-delay:-' + d + 's;animation-delay:-' + d + 's">' +
          '<circle cx="' + x.toFixed(1) + '" cy="' + (y + 15).toFixed(1) + '" r="15" fill="' + c + '" fill-opacity=".3"/>' +
          '<rect x="' + (x - 3.5).toFixed(1) + '" y="' + (y - 1).toFixed(1) + '" width="7" height="6" rx="1" fill="#2E4A38"/>' +
          '<ellipse cx="' + x.toFixed(1) + '" cy="' + (y + 14).toFixed(1) + '" rx="6.5" ry="10" fill="' + c + '"/>' +
          '<ellipse cx="' + (x - 2).toFixed(1) + '" cy="' + (y + 10).toFixed(1) + '" rx="1.7" ry="3.2" fill="#FFFFFF" fill-opacity=".55"/></g>';
        k++;
      });
    }
    box.innerHTML = '<svg width="' + W + '" height="58" viewBox="0 0 ' + W + ' 58"><path d="' + wire + '" fill="none" stroke="#1F3A2A" stroke-width="2.2"/>' + bulbs + "</svg>";
  }
  window.addEventListener("resize", function(){ applySkin(); });

  /* clock */
  function tick(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    $("clock").innerHTML = h + ":" + (m < 10 ? "0" : "") + m + "<small>" + ap + "</small>";
    $("date").textContent = now.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});
    ageNote();
  }

  /* tiles */
  function renderTiles(){
    $("tiles").innerHTML = tiles.map(function(t, i){
      var ic = ICONS[t.icon] || ICONS.bulb;
      var run = function(n){ return "shortcuts://run-shortcut?name=" + encodeURIComponent(n); };
      return '<div class="tile"><div class="label"><span class="ic c-' + ic.c + '">' + svg(ic.p) + '</span><span class="name">' + esc(t.label) + '</span></div>' +
        '<div class="acts"><a class="act on b-' + ic.c + '" href="' + esc(run(t.on)) + '" aria-label="' + esc(t.label) + ' on">On</a>' +
        '<a class="act" href="' + esc(run(t.off)) + '" aria-label="' + esc(t.label) + ' off">Off</a></div></div>';
    }).join("");
  }
  $("tiles").addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest(".act") : null;
    if (!a) return;
    a.classList.add("sent");
    setTimeout(function(){ a.classList.remove("sent"); }, 2000);
  });

  /* settings */
  function openSheet(){
    $("wxmodes").innerHTML = WXMODES.map(function(m){ return '<button type="button" data-wx="' + m[0] + '" class="' + (wxMode === m[0] ? "on" : "") + '">' + m[1] + "</button>"; }).join("");
    $("skins").innerHTML = SKINS.map(function(s){ return '<button type="button" data-skin="' + s[0] + '" class="' + (skin === s[0] ? "on" : "") + '">' + s[1] + "</button>"; }).join("");
    $("rows").innerHTML = tiles.map(function(t, i){
      var opts = Object.keys(ICONS).map(function(k){ return '<option value="' + k + '"' + (k === t.icon ? " selected" : "") + ">" + ICONS[k].n + "</option>"; }).join("");
      return '<div class="row"><div class="f"><label for="l' + i + '">Row ' + (i + 1) + ' name</label><input id="l' + i + '" value="' + esc(t.label) + '" maxlength="28"></div>' +
        '<div class="f"><label for="n' + i + '">On shortcut</label><input id="n' + i + '" value="' + esc(t.on) + '" maxlength="80" autocapitalize="off" autocorrect="off"></div>' +
        '<div class="f"><label for="o' + i + '">Off shortcut</label><input id="o' + i + '" value="' + esc(t.off) + '" maxlength="80" autocapitalize="off" autocorrect="off"></div>' +
        '<div class="f" style="flex:.6;min-width:140px"><label for="c' + i + '">Icon</label><select id="c' + i + '">' + opts + "</select></div></div>";
    }).join("");
    $("msg").textContent = "";
    $("sheet").hidden = false;
  }
  $("gear").addEventListener("click", openSheet);
  $("cancel").addEventListener("click", function(){ $("sheet").hidden = true; });
  $("wxmodes").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    wxMode = b.getAttribute("data-wx"); save("kp.wxmode", wxMode); renderWx(); openSheet();
  });
  $("skins").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    skin = b.getAttribute("data-skin"); save("kp.skin", skin); applySkin(); openSheet();
  });
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var next = tiles.map(function(t, i){ return {label:$("l" + i).value.trim(), on:$("n" + i).value.trim(), off:$("o" + i).value.trim(), icon:$("c" + i).value}; });
    for (var i = 0; i < next.length; i++){ if (!next[i].label || !next[i].on || !next[i].off){ $("msg").textContent = "Row " + (i + 1) + " needs a name and both shortcut names."; return; } }
    tiles = next; save("kp.tiles2", tiles); renderTiles(); $("sheet").hidden = true;
  });

  /* weather from the National Weather Service */
  var LAT = 39.5754, LON = -76.9958, wxAt = null;
  var WXI = {
    sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>',
    moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>',
    partly:'<path d="M8 3v1.5M3.5 8H5M4.8 4.8l1 1"/><circle cx="8.5" cy="8.5" r="3"/><path d="M7 20h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.4 1.6A3.2 3.2 0 0 0 7 20Z"/>',
    cloud:'<path d="M6 19h11a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 2A3.5 3.5 0 0 0 6 19Z"/>',
    rain:'<path d="M6 15h11a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 2A3.5 3.5 0 0 0 6 15Z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    snow:'<path d="M6 15h11a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 2A3.5 3.5 0 0 0 6 15Z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 22h.01M14 22h.01"/>'
  };
  function iconFor(text, day){
    var t = String(text || "").toLowerCase();
    if (/snow|sleet|ice|flurr/.test(t)) return "snow";
    if (/rain|shower|storm|drizzle/.test(t)) return "rain";
    if (/partly|mostly sunny|mostly clear/.test(t)) return day ? "partly" : "moon";
    if (/cloud|overcast|fog/.test(t)) return "cloud";
    return day ? "sun" : "moon";
  }
  function getJSON(url){
    return fetch(url, {headers:{"Accept":"application/geo+json"}}).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function refreshWeather(){
    var pts = load("kp.points.21157", null);
    var p = pts ? Promise.resolve(pts) : getJSON("https://api.weather.gov/points/" + LAT + "," + LON).then(function(j){
      var v = {forecast:j.properties.forecast, hourly:j.properties.forecastHourly}; save("kp.points.21157", v); return v;
    });
    p.then(function(v){
      return Promise.all([getJSON(v.forecast), getJSON(v.hourly)]);
    }).then(function(res){
      var periods = res[0].properties.periods || [], hourly = res[1].properties.periods || [];
      var nowP = hourly[0] || periods[0];
      $("temp").innerHTML = esc(nowP.temperature) + "<sup>&deg;F</sup>";
      $("cond").textContent = nowP.shortForecast;
      var ic = iconFor(nowP.shortForecast, nowP.isDaytime);
      $("wxicon").innerHTML = svg(WXI[ic], 1.6);
      $("wxicon").firstChild.style.color = ic === "sun" ? "var(--amber)" : (ic === "moon" ? "var(--cool)" : "var(--sky)");
      WX = {periods:periods, hourly:hourly};
      renderWx();
      wxAt = new Date(); ageNote();
    }).catch(function(){
      try { localStorage.removeItem("kp.points.21157"); } catch (e) {}
      if (!wxAt) $("cond").textContent = "Weather unavailable, retrying";
      ageNote();
    });
  }
  function rainOf(p){ return (p && p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value) || 0; }
  function dayList(periods){
    var days = [];
    for (var i = 0; i < periods.length; i++){
      var pd = periods[i];
      if (pd.isDaytime){
        var night = periods[i + 1] && !periods[i + 1].isDaytime ? periods[i + 1] : null;
        days.push({name:pd.name, hi:pd.temperature, lo:night ? night.temperature : null, rain:rainOf(pd), text:pd.shortForecast, day:true});
      } else if (i === 0){
        days.push({name:"Tonight", hi:null, lo:pd.temperature, rain:rainOf(pd), text:pd.shortForecast, day:false});
      }
    }
    return days;
  }
  function label(d, i){ return i === 0 ? (d.name === "Tonight" ? "Tonight" : "Today") : d.name.slice(0, 3); }
  function renderWx(){
    if (!WX) return;
    var periods = WX.periods, hourly = WX.hourly, days = dayList(periods), first = days[0], html = "";
    $("hl").textContent = first ? ((first.hi != null ? "High " + first.hi + "°" : "") + (first.hi != null && first.lo != null ? " · " : "") + (first.lo != null ? "Low " + first.lo + "°" : "")) : "";
    if (wxMode === "week"){
      var wk = days.slice(0, 7), vals = [];
      wk.forEach(function(d){ if (d.hi != null) vals.push(d.hi); if (d.lo != null) vals.push(d.lo); });
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), sp = Math.max(1, mx - mn);
      html = '<div class="wk">' + wk.map(function(d, i){
        var lo = d.lo != null ? d.lo : d.hi, hi = d.hi != null ? d.hi : d.lo;
        var left = (lo - mn) / sp * 100, width = Math.max(4, (hi - lo) / sp * 100);
        return '<div class="wk-row"><span class="d">' + esc(label(d, i)) + '</span><span class="ic">' + svg(WXI[iconFor(d.text, d.day)], 1.6) + '</span><span class="r">' + (d.rain >= 20 ? esc(d.rain) + "%" : "") +
          '</span><span class="lo">' + (d.lo != null ? esc(d.lo) + "°" : "") + '</span><span class="bar"><span style="left:' + left.toFixed(1) + "%;width:" + Math.min(100 - left, width).toFixed(1) + '%"></span></span><span class="hi">' + (d.hi != null ? esc(d.hi) + "°" : "") + "</span></div>";
      }).join("") + "</div>";
    } else if (wxMode === "today"){
      var p0 = periods[0], p1 = periods[1];
      html = (p0 ? '<div class="today-text"><b>' + esc(p0.name) + ":</b> " + esc(p0.detailedForecast) + "</div>" : "") +
             (p1 ? '<div class="today-night"><b>' + esc(p1.name) + ":</b> " + esc(p1.detailedForecast) + "</div>" : "");
    } else if (wxMode === "hourly"){
      html = '<div class="hours">' + hourly.slice(0, 8).map(function(h){
        var t = new Date(h.startTime), hh = t.getHours(), ap = hh >= 12 ? "p" : "a"; hh = hh % 12 || 12;
        return '<div class="hr"><div class="t">' + hh + ap + '</div><div class="ic">' + svg(WXI[iconFor(h.shortForecast, h.isDaytime)], 1.6) + '</div><div class="v">' + esc(h.temperature) + '°</div><div class="r">' + (rainOf(h) >= 20 ? esc(rainOf(h)) + "%" : "") + "</div></div>";
      }).join("") + "</div>";
    } else {
      html = '<div class="days">' + days.slice(0, 5).map(function(d, i){
        return '<div class="day"><div class="d">' + esc(label(d, i)) + '</div><div class="hi">' + (d.hi != null ? esc(d.hi) + "°" : "&nbsp;") + '</div><div class="lo">' + (d.lo != null ? esc(d.lo) + "°" : "&nbsp;") + '</div><div class="r">' + (d.rain >= 20 ? esc(d.rain) + "%" : "") + "</div></div>";
      }).join("") + "</div>";
    }
    $("wxbody").innerHTML = html;
  }
  function ageNote(){
    if (!wxAt){ return; }
    var mins = (Date.now() - wxAt.getTime()) / 60000;
    var h = wxAt.getHours(), m = wxAt.getMinutes(), ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    $("upd").textContent = "Updated " + h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
    $("foot").className = "foot" + (mins > 90 ? " stale" : "");
  }

  applySkin(); renderTiles(); tick(); refreshWeather();
  setInterval(tick, 10000);
  setInterval(applySkin, 60 * 60 * 1000);
  setInterval(refreshWeather, 20 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible"){ tick(); if (!wxAt || Date.now() - wxAt.getTime() > 15 * 60000) refreshWeather(); } });
})();
</script>
</body>
</html>
